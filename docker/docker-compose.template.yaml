services:
  mailpit:
    image: axllent/mailpit
    expose:
      - "8025"
      - "1025"
    environment:
      TZ: ${TIMEZONE:-Europe/Prague}

  database:
    image: postgres:19-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-app}
      POSTGRES_USER: ${DATABASE_USER:-app}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-app123$}
      TZ: ${TIMEZONE:-Europe/Prague}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${DATABASE_NAME:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw

  app:
    build:
      context: franken-php
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    links:
      - database:database
      - mailpit:mailpit
    volumes:
      - ./franken-php/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ./:/var/www:cached
# !! uncomment the two lines below ONLY if you are using Docker in Linux - required for Xdebug !!
#    extra_hosts:
#      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Europe/Prague}
      MAILER_DSN: smtp://mailpit:1025
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=19&charset=utf8

volumes:
  caddy_data:
  caddy_config:
  database_data:
